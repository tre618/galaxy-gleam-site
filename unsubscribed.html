<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#050f09">
  <title>Successfully Unsubscribed | Galaxy Gleam Media</title>
  <meta name="description" content="Your Galaxy Gleam Media email preference has been updated.">
  <link rel="icon" href="/logo-thumb.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050f09;
      --panel: #091c12;
      --text: #ffffff;
      --muted: #b8d2bf;
      --green: #6df49a;
      --gold: #f4d675;
      --gold-dim: #a9862b;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 10%, rgba(46, 230, 107, 0.14), transparent 32rem),
        radial-gradient(circle at 90% 90%, rgba(212, 175, 55, 0.12), transparent 28rem),
        var(--bg);
      font-family: "Manrope", Arial, sans-serif;
    }
    main {
      width: min(100%, 640px);
      padding: clamp(32px, 7vw, 58px);
      text-align: center;
      border: 1px solid rgba(244, 214, 117, 0.24);
      border-radius: 24px;
      background: linear-gradient(150deg, rgba(13, 38, 25, 0.97), rgba(6, 19, 12, 0.98));
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.5);
    }
    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 22px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 0 1px rgba(244, 214, 117, 0.35);
    }
    .check {
      display: grid;
      place-items: center;
      width: 54px;
      height: 54px;
      margin: 0 auto 20px;
      border-radius: 50%;
      color: #03240e;
      background: var(--green);
      font-size: 1.7rem;
      font-weight: 700;
    }
    h1 {
      margin: 0 0 14px;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(2.4rem, 8vw, 4rem);
      line-height: 1;
    }
    p {
      margin: 0 auto;
      max-width: 500px;
      color: var(--muted);
      line-height: 1.7;
    }
    a {
      display: inline-block;
      margin-top: 30px;
      padding: 13px 24px;
      border-radius: 999px;
      color: #241b03;
      background: linear-gradient(135deg, var(--gold), var(--gold-dim));
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/logo-thumb.jpg" alt="Galaxy Gleam Media logo" width="72" height="72">
    <div class="check" aria-hidden="true">✓</div>
    <h1>You’re unsubscribed.</h1>
    <p>Your request has been recorded. Galaxy Gleam Media will not send future promotional outreach to that email address.</p>
    <a href="https://www.galaxygleammedia.com">Return to Galaxy Gleam Media</a>
  </main>
</body>
</html>
